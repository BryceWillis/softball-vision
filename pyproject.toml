[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sidelinehd-extractor"
version = "0.7.1"
description = "Local SidelineHD overlay OCR and YouTube timestamp exporter"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "opencv-python>=4.9",
    "yt-dlp>=2025.1",
    "imageio-ffmpeg>=0.4.9",
]

[project.optional-dependencies]
# CR-103: `ruff` is pinned exactly, not floored. It is a dev tool whose entire
# value is that the implementer's local run and CI's agree — an unpinned floor
# meant CI resolved 0.16.0 while this machine had 0.15.20, the Lint step was red
# on all six legs for twelve consecutive pushes, and every handoff's "ruff clean"
# meant only "clean against whatever version I happened to have". Bumping it is
# now a deliberate edit with a review, which is the point. (This does not
# contradict the recorded decision declining a `yt-dlp` cap: that is a runtime
# dependency whose newest release is what keeps downloads working, and its
# in-repo record is `KNOWN_GOOD_YTDLP_VERSION` in `youtube.py` instead.)
dev = [
    "pytest>=8.0",
    "ruff==0.15.20",
    "httpx>=0.27",
]
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]
ocr = [
    "tesserocr>=2.7",
    "Pillow>=10",
]
# Items 54d + 68b + 70b + 70c: the macOS Dock-app launcher (python -m
# sidelinehd_extractor.desktop and the PyInstaller .app bundle). Needs the
# web extra too. WebKit is the app's native window (item 70b): the system
# WKWebView renders the same page the browser does, so there is no bundled
# runtime to ship and nothing new to sign. UserNotifications is item 70c's
# "your game is ready" — best-effort by design, so its absence degrades to
# no notification rather than to a broken launch.
desktop = [
    "pyobjc-framework-Cocoa",
    "pyobjc-framework-WebKit",
    "pyobjc-framework-UserNotifications",
]

[project.scripts]
sidelinehd-extractor = "sidelinehd_extractor.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

# CR-103: the rule set is named here rather than inherited from whatever the
# resolved `ruff` happens to default to. These four are exactly the historical
# default (`E4`, `E7`, `E9`, `F`) that the codebase has always been clean
# against; 0.16.0 widened its default to ~35 prefixes, which is what produced
# 968 errors on CI against code no one had changed. Adopting a wider rule set is
# a change of its own, with its own review and its own diff — not something a
# version bump should do silently. Selecting E4 explicitly also keeps the four
# E402 suppressions in the test suite load-bearing rather than inert.
#
# CR-106, before you widen this list: a prefix appearing in some release's
# default `select` does not mean every rule under it is enabled. 0.16.0's
# default lists `N` and enables exactly one rule from that family (N999) — a
# fact that was got backwards once, which left three in-file suppressions
# reading as load-bearing while they suppressed nothing. Selecting a rule on
# the command line proves only that it fires when selected; the check that
# settles what is actually enabled is
#     ruff check --isolated --show-settings <file>
# and grepping its `linter.rules.enabled` block for the rule itself. Under the
# pinned 0.15.20 that block is diff-identical with and without this file's
# select, which is what makes the declaration a repair and not a narrowing.
#
# CR-109: this array is not only read by ruff. A guard in tests/test_docs.py
# sweeps every tracked module and asserts that each in-file suppression names a
# rule this list enables — so narrowing it does not quietly render existing
# suppressions inert any more, it fails the suite and names each line it
# orphaned. Widening it is free; narrowing it is a decision you will be asked
# to finish.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
